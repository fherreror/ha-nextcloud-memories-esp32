name: Validate integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline tests and Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies (no Home Assistant/Nextcloud)
        run: python -m pip install pytest aiohttp pyyaml ruff
      - name: Check Python syntax
        run: python -m compileall -q custom_components tests
      - name: Ruff critical code checks
        run: ruff check custom_components tests --select E4,E7,E9,F63,F7,F82
      - name: Run offline tests
        run: pytest -q

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: Marketplace / HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: "false"
